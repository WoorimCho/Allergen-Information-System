server.port=8080

# --- Downstream services (BFF composition) ----------------------------------
# Localhost defaults for dev; override with the compose/k8s service names when
# the whole system runs together.
recipe-catalogue.url=${RECIPE_CATALOGUE_URL:http://localhost:8083}
ingredient-catalogue.url=${INGREDIENT_CATALOGUE_URL:http://localhost:8082}
user-service.url=${USER_SERVICE_URL:http://localhost:8084}

# Fail fast on a slow / dead downstream instead of tying up a request thread.
# spring.http.clients.* (plural) is the Boot 4.1 key that feeds the shared
# HttpClientSettings -> the auto-configured RestClient.Builder (all *Client beans).
# Combined with the per-downstream circuit breakers in CatalogueClientConfig.
spring.http.clients.connect-timeout=${DOWNSTREAM_CONNECT_TIMEOUT:2s}
spring.http.clients.read-timeout=${DOWNSTREAM_READ_TIMEOUT:5s}

# --- Operations & tracing --------------------------------------------------
# /actuator/** is open (the /bff/** security chain doesn't cover it) - fine for
# a trusted-network dev setup.
management.endpoints.web.exposure.include=health,info,prometheus
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:1.0}
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# --- Inter-service auth (SECURITY.md C1/C2) ------------------------------------
# The BFF signs every call to the User service + catalogues with an HMAC
# X-Internal-Auth header (acting user = the logged-in BffPrincipal).
internal-auth.secret=${INTERNAL_AUTH_SECRET:dev-internal-secret-change-me}
