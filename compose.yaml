# Runs just the BFF + GoodNight. For the full system use ../compose.yaml.
#
# Copy .env.example to .env (git-ignored) and set INTERNAL_AUTH_SECRET, the HMAC
# secret the BFF signs its downstream calls with (`openssl rand -hex 24`).
# Compose refuses to start while it is unset or empty.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allergen-app
    depends_on:
      goodnightworld:
        condition: service_started
    environment:
      - 'GOODNIGHT_URL=http://goodnightworld:8085'
      - 'INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:?set in .env}'
    ports:
      - '127.0.0.1:8080:8080'
    networks:
      - allergen-network
    restart: unless-stopped

  goodnightworld:
    build:
      context: ../GoodNightWorld
      dockerfile: Dockerfile
    container_name: goodnightworld
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - 'FEIGN_CLIENT_CONFIG_DYNAMICRECEIVER_URL=http://allergen-app:8080/response'
    ports:
      - '127.0.0.1:8085:8085'
    networks:
      - allergen-network
    restart: unless-stopped

networks:
  allergen-network:
    driver: bridge
