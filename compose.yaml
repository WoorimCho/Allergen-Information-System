# Runs just the BFF + GoodNight. For the full system use ../compose.yaml.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allergen-app
    depends_on:
      goodnightworld:
        condition: service_started
    environment:
      - 'GOODNIGHT_URL=http://goodnightworld:8085'
    ports:
      - '8080:8080'
    networks:
      - allergen-network
    restart: unless-stopped

  goodnightworld:
    build:
      context: ../GoodNightWorld
      dockerfile: Dockerfile
    container_name: goodnightworld
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - 'FEIGN_CLIENT_CONFIG_DYNAMICRECEIVER_URL=http://allergen-app:8080/response'
    ports:
      - '8085:8085'
    networks:
      - allergen-network
    restart: unless-stopped

networks:
  allergen-network:
    driver: bridge
